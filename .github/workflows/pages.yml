name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate public pages
        run: python3 scripts/check-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public content only
        run: |
          mkdir -p _site
          cp -R index.html assets kimgames kimdrop filebridge app-ads.txt .nojekyll _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
